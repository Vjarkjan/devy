[package]
name = "devy"
version = "0.1.0"
edition = "2024"
description = "Bevy ECS para Nintendo DS con BlocksDS, iteración de kts-nds y Digraph"
repository = "https://github.com/Vjarkjan/devy"
readme = "README.md"
publish = false
links = "devy_nds"
build = "build.rs"

[features]
default = ["runtime"]
# El ejecutable puede suministrar su propio allocator y panic handler.
runtime = ["allocator", "panic-handler"]
allocator = []
panic-handler = []
storage = []

[workspace]
resolver = "3"
members = ["tools/bevy_nds_3d_obj", "tools/bevy_nds_3d_macros", "tools/obj2dl", "tools/wav2bank", "tools/png2sprite", "tools/png2bg", "tools/scene2bin", "tools/perfread"]
default-members = ["."]
exclude = ["tools/scene-editor"]

[dependencies]
libm = { version = "0.2", default-features = false }
bevy_nds_3d_macros = { path = "tools/bevy_nds_3d_macros" }
bevy_app = { version = "=0.16.1", default-features = false }
bevy_ecs = { version = "=0.16.1", default-features = false }
bevy_input = { version = "=0.16.1", default-features = false, features = ["libm"] }
bevy_math = { version = "=0.16.1", default-features = false, features = ["libm"] }
bevy_time = { version = "=0.16.1", default-features = false }

[target.'cfg(target_vendor = "nintendo")'.dependencies]
bevy_app = { version = "=0.16.1", default-features = false, features = ["critical-section"] }
bevy_ecs = { version = "=0.16.1", default-features = false, features = ["critical-section"] }
bevy_input = { version = "=0.16.1", default-features = false, features = ["critical-section"] }
bevy_time = { version = "=0.16.1", default-features = false, features = ["critical-section"] }
critical-section = { version = "1.2", features = ["restore-state-bool"] }
portable-atomic = { version = "1", default-features = false, features = ["critical-section"] }

[target.'cfg(not(target_vendor = "nintendo"))'.dependencies]
bevy_app = { version = "=0.16.1", default-features = false, features = ["std"] }
bevy_ecs = { version = "=0.16.1", default-features = false, features = ["std"] }
bevy_input = { version = "=0.16.1", default-features = false, features = ["std"] }
bevy_time = { version = "=0.16.1", default-features = false, features = ["std"] }

[dev-dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }

[[example]]
name = "digraph"
required-features = ["runtime"]

[[example]]
name = "hello"
required-features = ["runtime"]

[[example]]
name = "drawing"
required-features = ["runtime"]

[[example]]
name = "storage"
required-features = ["runtime", "storage"]

[profile.dev]
panic = "abort"
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
# Conservar símbolos permite inspeccionar una ROM en el emulador.
debug = 1
